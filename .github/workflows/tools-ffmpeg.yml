name: FFmpeg tools release

on:
  schedule:
    # Once a week, before the weekly CI run on Monday: rebuild the test
    # binaries if the cache was evicted.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'The FFmpeg version to build and release (from tools/ffmpeg/source.env, e.g. 8.1.3)'
        required: true
        default: '8.1.3'
      n:
        description: 'The number of the release (the -<n> of tools-ffmpeg-<version>-<n>)'
        required: true
        default: '1'
  push:
    branches: [main]
    paths:
      - 'tools/ffmpeg/**'
      - '.github/workflows/tools-ffmpeg.yml'

permissions:
  contents: write

env:
  FFMPEG_VERSION: '8.1.3'
  FFMPEG_TARBALL: 'ffmpeg-8.1.3.tar.xz'
  FFMPEG_URL: 'https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz'
  FFMPEG_SHA256: '7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3'
  FFMPEG_SIGNING_KEY: 'FCF986EA15E6E293A5644F10B4322F04D67658D8'

jobs:
  build:
    name: Build the FFmpeg tools (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows-x86_64
            runs-on: windows-latest
            # MinGW links winpthread dynamically by default; the check after
            # the build refuses a file that needs it (ADR-0009, checklist
            # items 1, 17 and 18: only the system's own DLLs).
            extra: '--extra-ldflags=-static'
          - system: windows-aarch64
            runs-on: windows-11-arm
            extra: '--extra-ldflags=-static'
          - system: macos-universal
            runs-on: macos-latest
          - system: linux-x86_64
            runs-on: ubuntu-latest
          - system: linux-aarch64
            runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The test-only build (ADR-0009, section 8.1): made here, kept in the
      # cache for the CI's real video tests, and never put in the release.
      - name: Restore the test-only FFmpeg build
        id: testgen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testgen
          key: ffmpeg-testgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ffmpeg/source.env', 'tools/ffmpeg/build.sh', 'tools/ffmpeg/configure-testgen.txt') }}
      - name: Use a POSIX temporary path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SRC_POSIX=$(cygpath -u "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Make sure make is there (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then make --version | head -n 1; exit 0; fi
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          if command -v mingw32-make >/dev/null 2>&1; then
            mkdir -p "$tmp/bin"
            cp "$(command -v mingw32-make)" "$tmp/bin/make.exe"
            echo "$tmp/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          if [ -x /c/msys64/usr/bin/pacman.exe ]; then
            /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed make
            echo "/c/msys64/usr/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "::error::no make, and no way to install it"; exit 1
      - name: Install the compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential
      - name: Get the source
        shell: bash
        run: bash tools/ffmpeg/get-source.sh "${SRC_POSIX:-$RUNNER_TEMP}/src"
      - name: Build the distributed binaries
        shell: bash
        env:
          MARSA_FFMPEG_EXTRA: ${{ matrix.extra }}
        run: bash tools/ffmpeg/build.sh dist "${SRC_POSIX:-$RUNNER_TEMP}/src/$FFMPEG_TARBALL" "${SRC_POSIX:-$RUNNER_TEMP}/out"
      - name: Build the test binaries
        shell: bash
        env:
          MARSA_FFMPEG_EXTRA: ${{ matrix.extra }}
        run: bash tools/ffmpeg/build.sh testgen "${SRC_POSIX:-$RUNNER_TEMP}/src/$FFMPEG_TARBALL" "${SRC_POSIX:-$RUNNER_TEMP}/testgen"
      - name: Smoke test
        shell: bash
        run: bash tools/ffmpeg/smoke-test.sh "${SRC_POSIX:-$RUNNER_TEMP}/out" "${SRC_POSIX:-$RUNNER_TEMP}/testgen"
      - name: Check the linked libraries
        shell: bash
        run: bash tools/ffmpeg/check-linked.sh "${SRC_POSIX:-$RUNNER_TEMP}/out"
      - name: Keep the test-only FFmpeg build for the CI
        if: steps.testgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/testgen
          key: ffmpeg-testgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ffmpeg/source.env', 'tools/ffmpeg/build.sh', 'tools/ffmpeg/configure-testgen.txt') }}
      - name: Build the macOS universal binaries
        if: matrix.system == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          tmp="${SRC_POSIX:-$RUNNER_TEMP}"
          # `out` holds the host build (arm64 on macos-latest); only the x86_64
          # half is built here. `--arch` alone changes FFmpeg's own choice of
          # code paths, not the compiler's target, so clang is given the slice
          # too; FFmpeg's name for the architecture is x86_64, not x64.
          extra="$(printf '%s\n' \
            '--arch=x86_64' \
            '--target-os=darwin' \
            '--enable-cross-compile' \
            '--extra-cflags=-arch x86_64' \
            '--extra-ldflags=-arch x86_64')"
          MARSA_FFMPEG_EXTRA="$extra" bash tools/ffmpeg/build.sh dist "$tmp/src/$FFMPEG_TARBALL" "$tmp/out-x64"
          lipo -create "$tmp/out/ffmpeg" "$tmp/out-x64/ffmpeg" -output "$tmp/out/ffmpeg.universal"
          lipo -create "$tmp/out/ffprobe" "$tmp/out-x64/ffprobe" -output "$tmp/out/ffprobe.universal"
          mv "$tmp/out/ffmpeg.universal" "$tmp/out/ffmpeg"
          mv "$tmp/out/ffprobe.universal" "$tmp/out/ffprobe"
          chmod +x "$tmp/out/ffmpeg" "$tmp/out/ffprobe"
          # Ad-hoc only (owner's decision on #100 and 2026-10-25: no Apple
          # or Microsoft signing): lipo invalidates any signature, and an
          # unsigned file is refused by macOS once it carries a quarantine
          # mark. The release notes say "ad-hoc, not notarised".
          codesign --force --sign - "$tmp/out/ffmpeg" "$tmp/out/ffprobe"
          codesign --verify "$tmp/out/ffmpeg" "$tmp/out/ffprobe"
      - name: Name the build files
        shell: bash
        run: |
          set -euo pipefail
          out="${SRC_POSIX:-$RUNNER_TEMP}/out"
          # The build file says how this binary was made (AGENTS.md,
          # checklist item 6). One release asset per system, so the names
          # do not overwrite each other when the artifacts are merged.
          mv "$out/ffmpeg-build.txt" "$out/ffmpeg-build-${{ matrix.system }}.txt"
          case "${{ matrix.system }}" in
            windows-x86_64)
              mv "$out/ffmpeg.exe" "$out/ffmpeg-windows-x86_64.exe"
              mv "$out/ffprobe.exe" "$out/ffprobe-windows-x86_64.exe"
              ;;
            windows-aarch64)
              mv "$out/ffmpeg.exe" "$out/ffmpeg-windows-aarch64.exe"
              mv "$out/ffprobe.exe" "$out/ffprobe-windows-aarch64.exe"
              ;;
            macos-universal)
              mv "$out/ffmpeg" "$out/ffmpeg-macos-universal"
              mv "$out/ffprobe" "$out/ffprobe-macos-universal"
              ;;
            linux-x86_64)
              mv "$out/ffmpeg" "$out/ffmpeg-linux-x86_64"
              mv "$out/ffprobe" "$out/ffprobe-linux-x86_64"
              ;;
            linux-aarch64)
              mv "$out/ffmpeg" "$out/ffmpeg-linux-aarch64"
              mv "$out/ffprobe" "$out/ffprobe-linux-aarch64"
              ;;
            *)
              echo "unknown system: ${{ matrix.system }}"; exit 1
              ;;
          esac
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.system }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  publish:
    name: Publish the FFmpeg tools release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The tag comes from the dispatch, never from a constant: a release is
      # published once and never changed (ADR-0009), so a fresh `n` must give
      # a fresh tag. Push and schedule runs do not publish.
      RELEASE_TAG: tools-ffmpeg-${{ inputs.version }}-${{ inputs.n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag names the pinned source: a typo here would publish a tag
          # whose name lies about what is inside.
          if [ "${{ inputs.version }}" != "$FFMPEG_VERSION" ]; then
            echo "::error::asked for ${{ inputs.version }}, but this commit pins $FFMPEG_VERSION"
            exit 1
          fi
          case "${{ inputs.n }}" in
            ''|*[!0-9]*) echo "::error::n must be a number, not '${{ inputs.n }}'"; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG is already published; releases are never changed (ADR-0009), so dispatch again with the next n"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          files=()
          for f in artifacts/*; do
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no build was published"; exit 1
          fi
          gh release create "$tag" \
            --latest=false \
            --title "FFmpeg $FFMPEG_VERSION (Marsa's build)" \
            --notes "FFmpeg $FFMPEG_VERSION, built by Marsa from $FFMPEG_URL (SHA-256 $FFMPEG_SHA256). Marsa's own build: remux only, plus the native AAC encoder for audio-only m4a; no --enable-gpl, no --enable-nonfree, no external library (LGPL 2.1 or later). The macOS files are signed ad-hoc only (a code signature, not notarised by Apple); the Windows and Linux files are not signed. The source, its signature, the licence texts and SHA256SUMS are the other assets." \
            "${files[@]}"
          echo "released $tag"
      - name: Upload the source to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/ffmpeg/get-source.sh "$RUNNER_TEMP/src"
          src="$RUNNER_TEMP/src"
          gh release upload "$RELEASE_TAG" \
            "$src/$FFMPEG_TARBALL" \
            "$src/$FFMPEG_TARBALL.asc" \
            --clobber
      - name: Pack the source with its build files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg"
          tar -xJf "$src/$FFMPEG_TARBALL" -C "$pkg"
          root="$pkg/ffmpeg-$FFMPEG_VERSION"
          # ADR-0009, checklist item 6: how each binary was made, inside
          # the source root, and the scripts and options that made it.
          cp artifacts/ffmpeg-build-*.txt "$root/"
          mkdir -p "$root/marsa-build"
          cp tools/ffmpeg/build.sh \
             tools/ffmpeg/configure-dist.txt \
             tools/ffmpeg/source.env \
             tools/ffmpeg/smoke-test.sh \
             tools/ffmpeg/check-linked.sh \
             "$root/marsa-build/"
          tarball="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION-marsa-source.tar.xz"
          tar -cJf "$tarball" -C "$pkg" "ffmpeg-$FFMPEG_VERSION"
          gh release upload "$RELEASE_TAG" "$tarball" --clobber
      - name: Upload the LGPL licence texts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          lic="$RUNNER_TEMP/licence"
          mkdir -p "$lic"
          tar -xJf "$src/$FFMPEG_TARBALL" -C "$lic" --strip-components=1 \
            "ffmpeg-$FFMPEG_VERSION/COPYING.LGPLv2.1" \
            "ffmpeg-$FFMPEG_VERSION/COPYING.LGPLv3" \
            "ffmpeg-$FFMPEG_VERSION/LICENSE.md"
          gh release upload "$RELEASE_TAG" \
            "$lic/COPYING.LGPLv2.1" \
            "$lic/COPYING.LGPLv3" \
            "$lic/LICENSE.md" \
            --clobber
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          lic="$RUNNER_TEMP/licence"
          sums="$RUNNER_TEMP/SHA256SUMS"
          # Every file in the release except this one, by its release name.
          {
            (cd "$src" && sha256sum "$FFMPEG_TARBALL" "$FFMPEG_TARBALL.asc")
            (cd artifacts && sha256sum ./*)
            (cd "$lic" && sha256sum ./*)
            (cd "$RUNNER_TEMP" && sha256sum "ffmpeg-$FFMPEG_VERSION-marsa-source.tar.xz")
          } | sed 's# \./# #' > "$sums"
          gh release upload "$RELEASE_TAG" "$sums" --clobber
