name: FFmpeg tools release

on:
  schedule:
    # Once a week, before the weekly CI run on Monday: rebuild the test
    # binaries if the cache was evicted.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'The FFmpeg version to build and release (from tools/ffmpeg/source.env, e.g. 8.1.3)'
        required: true
        default: '8.1.3'
      n:
        description: 'The number of the release (the -<n> of tools-ffmpeg-<version>-<n>)'
        required: true
        default: '1'
  push:
    branches: [main]
    paths:
      - 'tools/ffmpeg/**'
      - '.github/workflows/tools-ffmpeg.yml'

permissions:
  contents: write

env:
  FFMPEG_VERSION: '8.1.3'
  FFMPEG_TARBALL: 'ffmpeg-8.1.3.tar.xz'
  FFMPEG_URL: 'https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz'
  FFMPEG_SHA256: '7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3'
  FFMPEG_SIGNING_KEY: 'FCF986EA15E6E293A5644F10B4322F04D67658D8'
  RELEASE_TAG: tools-ffmpeg-8.1.3-1

jobs:
  build:
    name: Build the FFmpeg tools (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows-x86_64
            runs-on: windows-latest
          - system: windows-aarch64
            runs-on: windows-11-arm
          - system: macos-universal
            runs-on: macos-latest
          - system: linux-x86_64
            runs-on: ubuntu-latest
          - system: linux-aarch64
            runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential
      - name: Get the source
        shell: bash
        run: bash tools/ffmpeg/get-source.sh "$RUNNER_TEMP/src"
      - name: Build the distributed binaries
        shell: bash
        run: bash tools/ffmpeg/build.sh dist "$RUNNER_TEMP/src/$FFMPEG_TARBALL" "$RUNNER_TEMP/out"
      - name: Build the test binaries
        shell: bash
        run: bash tools/ffmpeg/build.sh testgen "$RUNNER_TEMP/src/$FFMPEG_TARBALL" "$RUNNER_TEMP/testgen"
      - name: Smoke test
        shell: bash
        run: bash tools/ffmpeg/smoke-test.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/testgen"
      - name: Check the linked libraries
        shell: bash
        run: bash tools/ffmpeg/check-linked.sh "$RUNNER_TEMP/out"
      - name: Build the macOS universal binaries
        if: matrix.system == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          MARSA_FFMPEG_EXTRA="--arch=x64" bash tools/ffmpeg/build.sh dist "$RUNNER_TEMP/src/$FFMPEG_TARBALL" "$RUNNER_TEMP/out-x64"
          MARSA_FFMPEG_EXTRA="--arch=arm64" bash tools/ffmpeg/build.sh dist "$RUNNER_TEMP/src/$FFMPEG_TARBALL" "$RUNNER_TEMP/out-arm64"
          lipo -create "$RUNNER_TEMP/out-arm64/ffmpeg" "$RUNNER_TEMP/out-x64/ffmpeg" -output "$RUNNER_TEMP/out/ffmpeg"
          lipo -create "$RUNNER_TEMP/out-arm64/ffprobe" "$RUNNER_TEMP/out-x64/ffprobe" -output "$RUNNER_TEMP/out/ffprobe"
          chmod +x "$RUNNER_TEMP/out/ffmpeg" "$RUNNER_TEMP/out/ffprobe"
      - name: Name the build files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          case "${{ matrix.system }}" in
            windows-x86_64)
              mv "$out/ffmpeg.exe" "$out/ffmpeg-windows-x86_64.exe"
              mv "$out/ffprobe.exe" "$out/ffprobe-windows-x86_64.exe"
              ;;
            windows-aarch64)
              mv "$out/ffmpeg.exe" "$out/ffmpeg-windows-aarch64.exe"
              mv "$out/ffprobe.exe" "$out/ffprobe-windows-aarch64.exe"
              ;;
            macos-universal)
              mv "$out/ffmpeg" "$out/ffmpeg-macos-universal"
              mv "$out/ffprobe" "$out/ffprobe-macos-universal"
              ;;
            linux-x86_64)
              mv "$out/ffmpeg" "$out/ffmpeg-linux-x86_64"
              mv "$out/ffprobe" "$out/ffprobe-linux-x86_64"
              ;;
            linux-aarch64)
              mv "$out/ffmpeg" "$out/ffmpeg-linux-aarch64"
              mv "$out/ffprobe" "$out/ffprobe-linux-aarch64"
              ;;
            *)
              echo "unknown system: ${{ matrix.system }}"; exit 1
              ;;
          esac
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.system }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  publish:
    name: Publish the FFmpeg tools release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          files=()
          for f in artifacts/*; do
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no build was published"; exit 1
          fi
          gh release create "$tag" \
            --title "FFmpeg $FFMPEG_VERSION (Marsa's build)" \
            --notes "FFmpeg $FFMPEG_VERSION, built by Marsa from $FFMPEG_URL (SHA-256 $FFMPEG_SHA256). Marsa's own build: remux only, plus the native AAC encoder for audio-only m4a; no --enable-gpl, no --enable-nonfree, no external library (LGPL 2.1 or later)." \
            "${files[@]}"
          echo "released $tag"
      - name: Upload the source to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/ffmpeg/get-source.sh "$RUNNER_TEMP/src"
          src="$RUNNER_TEMP/src"
          gh release upload "$RELEASE_TAG" \
            "$src/$FFMPEG_TARBALL" \
            "$src/$FFMPEG_TARBALL.asc" \
            --clobber
      - name: Upload the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          sha256sum "$src/$FFMPEG_TARBALL" > SHA256SUMS
          gh release upload "$RELEASE_TAG" \
            SHA256SUMS \
            --clobber
