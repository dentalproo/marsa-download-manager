version: 2
updates:
  # Rust crates: the engine and the command line.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  # Rust crates: the desktop app has its own workspace and lock file.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /apps/extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  # Pinned by commit SHA in .github/workflows; Dependabot raises them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
